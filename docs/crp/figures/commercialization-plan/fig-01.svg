<svg viewBox="0 8 300 314" role="img" aria-label="The cycle of unmet eldercare need: needs go unmet, preventable complications follow, then emergency care, rehabilitation, discharge home to the same gaps, and recurrence, exiting to institutionalization and Medicaid spend-down. Two Olera interventions break the cycle where needs first go unmet.">
      <defs>
        <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5a6660"/></marker>
        <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2e7d5b"/></marker>
      </defs>
      <!-- entry -->
      <text x="150" y="16" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="700" fill="#141414">Care need emerges</text>
      <path d="M150 22 L150 48" stroke="#5a6660" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
      <!-- cycle nodes -->
      <g font-family="Arial" font-size="8.5" fill="#141414" text-anchor="middle">
        <text x="150" y="60" font-weight="700">Daily needs go unmet</text>
        <text x="150" y="70" font-size="7.5" fill="#4a554f">bathing · meals · medications · supervision</text>
        <text x="252" y="122" font-weight="700">Falls · malnutrition</text>
        <text x="252" y="132" font-weight="700">medication errors</text>
        <text x="252" y="200" font-weight="700">ED visits ·</text>
        <text x="252" y="210" font-weight="700">hospitalization</text>
        <text x="150" y="258" font-weight="700">Rehab, then discharge home</text>
        <text x="48" y="200" font-weight="700">Same gaps</text>
        <text x="48" y="210" font-weight="700">at home</text>
        <text x="48" y="122" font-weight="700">Recurrence,</text>
        <text x="48" y="132" font-weight="700">worse baseline</text>
      </g>
      <!-- cycle arrows (clockwise) -->
      <path d="M218 56 Q244 76 250 108" stroke="#5a6660" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
      <path d="M252 140 L252 186" stroke="#5a6660" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
      <path d="M250 216 Q244 240 234 250" stroke="#5a6660" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
      <path d="M66 250 Q56 240 50 218" stroke="#5a6660" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
      <path d="M48 186 L48 140" stroke="#5a6660" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
      <path d="M52 108 Q60 76 90 58" stroke="#5a6660" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
      <!-- exit -->
      <path d="M252 218 Q262 268 210 292" stroke="#8a5a12" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#ah)"/>
      <g font-family="Arial" font-size="8.5" text-anchor="middle" fill="#6b4c12">
        <text x="150" y="306" font-weight="700">Exit: premature institutionalization</text>
        <text x="150" y="317">asset depletion · Medicaid spend-down · public cost</text>
      </g>
      <!-- Olera interventions -->
      <g font-family="Arial" font-size="8.5" fill="#2e7d5b" font-weight="700">
        <text x="8" y="26" text-anchor="start">Olera 1: existing aid &amp;</text>
        <text x="8" y="36" text-anchor="start">care reached in time</text>
        <text x="292" y="26" text-anchor="end">Olera 2: workforce</text>
        <text x="292" y="36" text-anchor="end">capacity added</text>
      </g>
      <path d="M48 40 Q76 46 98 49" stroke="#2e7d5b" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
      <path d="M252 40 Q224 46 202 49" stroke="#2e7d5b" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
    </svg>