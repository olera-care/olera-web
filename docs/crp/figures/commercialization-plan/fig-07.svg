<svg style="width:100%;max-width:6.0in;display:block;margin:0 auto" viewBox="0 0 720 212" role="img" aria-label="What completing the aims produces: three aim outputs assemble into an evidence package with sustainability thresholds crossed, opening two capital paths, operating revenue and private investment, to a sustainable commercial model beyond government support.">
