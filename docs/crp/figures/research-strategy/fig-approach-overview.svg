<svg viewBox="0 0 780 330" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Overview of the specific aims and tasks. From broad national traction, Aim 1 verifies, validates, and builds adoption of the family-facing CareNavigator and Aim 2 does the same for the Provider Growth Suite, together building local market depth across families, providers, and workforce. Aim 3 prices the products and measures who buys, who stays, and revenue versus all costs, producing profit and investor readiness. After the award: sustainability and accelerated market capture.">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5a6660"/></marker>
    <marker id="t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#0f9b8e"/></marker>
  </defs>

  <!-- ===== TODAY (left column) ===== -->
  <rect x="14" y="42" width="92" height="260" rx="8" fill="#f3f4f6" stroke="#c3cad2" stroke-width="1.2"/>
