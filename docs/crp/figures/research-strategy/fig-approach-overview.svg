  <rect x="604" y="260" width="160" height="52" rx="8" fill="#ffffff" stroke="#0f9b8e" stroke-width="1.4"/>
  <text x="684" y="280" font-size="9" fill="#0b6e65" text-anchor="middle" font-weight="700">AFTER THE AWARD</text>
  <text x="684" y="294" font-size="8.5" fill="#4b5563" text-anchor="middle">sustainability ·</text>
  <text x="684" y="306" font-size="8.5" fill="#4b5563" text-anchor="middle">accelerated market capture</text>
