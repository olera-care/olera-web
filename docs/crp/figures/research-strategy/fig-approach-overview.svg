  <text x="492" y="268" font-size="10" fill="#1e2a38" text-anchor="middle" font-weight="700">Build provider</text>
  <text x="492" y="284" font-size="10" fill="#1e2a38" text-anchor="middle" font-weight="700">adoption</text>
  <text x="492" y="316" font-size="8" fill="#6b7280" text-anchor="middle">Task 2.3</text>

  <!-- ===== AIM 3 (right) ===== -->
  <path d="M558 165 L598 165" stroke="#0f9b8e" stroke-width="2.2" fill="none" marker-end="url(#t)"/>

  <rect x="604" y="90" width="160" height="150" rx="9" fill="#1e2a38"/>
  <text x="684" y="116" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">AIM 3</text>
