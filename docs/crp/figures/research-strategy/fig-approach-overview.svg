  <text x="60" y="178" font-size="8.5" fill="#4b5563" text-anchor="middle">broad national</text>
  <text x="60" y="190" font-size="8.5" fill="#4b5563" text-anchor="middle">traction</text>
  <path d="M106 71 L114 71" stroke="#5a6660" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M106 273 L114 273" stroke="#5a6660" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

