  <path d="M534 100 L534 130" stroke="#0f9b8e" stroke-width="1.8" fill="none" marker-end="url(#t)"/>
  <path d="M534 244 L534 200" stroke="#0f9b8e" stroke-width="1.8" fill="none" marker-end="url(#t)"/>

