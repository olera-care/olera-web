    <path d="M157 213 L190 207 M157 213 L190 228 M157 213 L190 249 M157 231 L190 207 M157 231 L190 228 M157 231 L190 249 M157 249 L190 207 M157 249 L190 228 M157 249 L190 249" fill="none"/>
    <path d="M190 207 L223 218 M190 207 L223 240 M190 228 L223 218 M190 228 L223 240 M190 249 L223 218 M190 249 L223 240" fill="none"/>
    <circle cx="157" cy="213" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="157" cy="231" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="157" cy="249" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="190" cy="207" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="190" cy="228" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="190" cy="249" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="223" cy="218" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="223" cy="240" r="3.6" fill="#ffffff" stroke-width="1.6"/>
  </g>

  <path d="M248 233 h16" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#bk)"/>

  <rect x="268" y="210" width="104" height="47" rx="6" fill="#17867f" stroke="#0f6b65"/>
  <g fill="#ffffff"><rect x="280" y="220" width="80" height="7" rx="3.5"/><rect x="280" y="231" width="80" height="7" rx="3.5"/><rect x="280" y="242" width="80" height="7" rx="3.5"/></g>

  <text x="60" y="273" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#111111">Text Input</text>
  <text x="190" y="291" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="700" fill="#111111">Eldercare-specific</text>
  <text x="190" y="305" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="700" fill="#111111">LLM</text>
  <text x="315" y="273" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="700" fill="#111111">Elder Care-Specific</text>
  <text x="315" y="287" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="700" fill="#111111">Output</text>

  <!-- ============ AGENTS ============ -->
  <path d="M190 318 v18" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#bk)"/>

  <rect x="8" y="342" width="364" height="64" rx="7" fill="#ffffff" stroke="#17867f" stroke-width="1.8"/>
  <text x="190" y="364" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="700" fill="#17867f">AI AGENTS</text>
  <text x="190" y="381" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#333333">automation for documents, scheduling, communication,</text>
  <text x="190" y="395" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#333333">follow-up, and human escalation when needed</text>
</svg>
