<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 412" style="width:100%;display:block" role="img" aria-label="Text input into a pre-trained LLM returns generic output. Parameter-efficient fine-tuning and retrieval-augmented generation adapt the model, so that text input into Olera's eldercare-specific LLM returns eldercare-specific output. AI agents then act on that output, with automation for documents, scheduling, communication, follow-up, and human escalation when needed.">
  <defs>
    <marker id="bk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- ============ ROW 1 : pre-trained ============ -->
  <text x="190" y="13" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#111111">Pre-trained</text>
  <text x="190" y="27" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#111111">LLM</text>
  <text x="60" y="45" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#111111">Text Input</text>
  <text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#111111">Generic Output</text>

  <rect x="8" y="52" width="104" height="47" rx="6" fill="#d9d9d9" stroke="#c4c4c4"/>
  <g fill="#9a9a9a"><rect x="20" y="62" width="70" height="7" rx="3.5"/><rect x="20" y="73" width="80" height="7" rx="3.5"/><rect x="20" y="84" width="52" height="7" rx="3.5"/></g>

  <path d="M116 75 h16" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#bk)"/>

  <rect x="138" y="34" width="104" height="83" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.4"/>
  <g stroke="#111111" stroke-width="1">
    <path d="M157 55 L190 49 M157 55 L190 70 M157 55 L190 91 M157 73 L190 49 M157 73 L190 70 M157 73 L190 91 M157 91 L190 49 M157 91 L190 70 M157 91 L190 91" fill="none"/>
    <path d="M190 49 L223 60 M190 49 L223 82 M190 70 L223 60 M190 70 L223 82 M190 91 L223 60 M190 91 L223 82" fill="none"/>
    <circle cx="157" cy="55" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="157" cy="73" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="157" cy="91" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="190" cy="49" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="190" cy="70" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="190" cy="91" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="223" cy="60" r="3.6" fill="#ffffff" stroke-width="1.6"/>
    <circle cx="223" cy="82" r="3.6" fill="#ffffff" stroke-width="1.6"/>
  </g>

  <path d="M248 75 h16" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#bk)"/>

  <rect x="268" y="52" width="104" height="47" rx="6" fill="#d9d9d9" stroke="#c4c4c4"/>
  <g fill="#ffffff"><rect x="280" y="62" width="80" height="7" rx="3.5"/><rect x="280" y="73" width="80" height="7" rx="3.5"/><rect x="280" y="84" width="80" height="7" rx="3.5"/></g>

  <!-- ============ ADAPTATION BAND ============ -->
  <text x="72" y="152" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="700" fill="#111111">Parameter- Efficient</text>
  <text x="72" y="166" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="700" fill="#111111">Fine-Tuning (PEFT)</text>

  <path d="M178 130 h24 v22 h13 l-25 26 l-25 -26 h13 v-22 z" fill="#111111"/>

  <text x="308" y="152" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="700" fill="#111111">Retrieval-Augmented</text>
  <text x="308" y="166" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="700" fill="#111111">Generation (RAG)</text>

  <!-- ============ ROW 2 : eldercare-specific ============ -->
  <rect x="8" y="210" width="104" height="47" rx="6" fill="#eef6f6" stroke="#cfd8d8"/>
  <g fill="#9a9a9a"><rect x="20" y="220" width="70" height="7" rx="3.5"/><rect x="20" y="231" width="80" height="7" rx="3.5"/><rect x="20" y="242" width="52" height="7" rx="3.5"/></g>

