  <rect x="330" y="308" width="340" height="34" rx="8" fill="#14453f"/>
  <text x="500" y="331" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">CARE ESTABLISHED</text>
</svg>
