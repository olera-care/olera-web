  <text x="185" y="234" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#14453f">Family's Situation</text>
  <text x="500" y="234" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#14453f">Eldercare-specific LLM</text>
  <text x="815" y="234" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#14453f">Eldercare-Specific Output</text>

  <!-- ============ BAND 2 : execution + follow-up (this award) ============ -->
  <text x="248" y="272" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#14453f">Agentic Task Execution</text>
  <text x="248" y="290" text-anchor="middle" font-family="Arial" font-size="13" fill="#5b6b68">prepares applications, books assessments</text>
  <path d="M492 250 h16 v28 h14 l-22 26 l-22 -26 h14 v-28 z" fill="#14453f"/>
  <text x="762" y="272" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#14453f">Longitudinal Case Tracking</text>
  <text x="762" y="290" text-anchor="middle" font-family="Arial" font-size="13" fill="#5b6b68">follows each case to a decision</text>

