<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 348" style="width:100%;display:block" role="img" aria-label="Engineering progression. A pre-trained model returns generic output. Parameter-efficient fine-tuning and expert feedback adapt the model, and retrieval-augmented generation grounds it in Olera's curated corpus, producing eldercare-specific output. Agentic task execution and longitudinal case tracking then turn that output into care established.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b68"/>
    </marker>
  </defs>

  <!-- ================= ROW 1 : pre-trained ================= -->
