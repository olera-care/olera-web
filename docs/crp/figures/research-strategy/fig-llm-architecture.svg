    <circle cx="481" cy="30" r="4"/><circle cx="481" cy="50" r="4"/><circle cx="481" cy="70" r="4"/>
    <circle cx="519" cy="40" r="4"/><circle cx="519" cy="60" r="4"/>
  </g>
  <path d="M612 50 h34" fill="none" stroke="#5b6b68" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="720" y="24" width="190" height="52" rx="7" fill="#e4e6e6" stroke="#c2c7c6"/>
  <g fill="#a9b0af"><rect x="738" y="38" width="154" height="8" rx="4"/><rect x="738" y="52" width="120" height="8" rx="4"/><rect x="738" y="64" width="140" height="6" rx="3"/></g>

  <!-- ============ BAND 1 : adaptation + grounding ============ -->
  <text x="248" y="112" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#14453f">Parameter-Efficient</text>
  <text x="248" y="130" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#14453f">Fine-Tuning (PEFT)</text>
  <text x="248" y="148" text-anchor="middle" font-family="Arial" font-size="13" fill="#5b6b68">+ expert clinician feedback</text>
  <path d="M492 92 h16 v28 h14 l-22 26 l-22 -26 h14 v-28 z" fill="#14453f"/>
  <text x="762" y="112" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#14453f">Retrieval-Augmented</text>
  <text x="762" y="130" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#14453f">Generation (RAG)</text>
  <text x="762" y="148" text-anchor="middle" font-family="Arial" font-size="13" fill="#5b6b68">over Olera's curated corpus</text>

