<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 348" style="width:100%;display:block" role="img" aria-label="Navigation architecture. A family's situation, described in their own words, is read by an eldercare-specific model adapted with parameter-efficient fine-tuning, retrieval-augmented generation, and expert clinician review, while a separate program rules engine makes the eligibility decisions. An agent execution loop, built under this award, prepares applications, tracks each filing, and escalates when a case stalls, until care is established.">
  <defs>
    <marker id="na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f9c99"/>
    </marker>
  </defs>

  <!-- family's situation -->
  <rect x="8" y="4" width="364" height="48" rx="7" fill="#f2f5f4" stroke="#d5dedc"/>
  <text x="190" y="25" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#14453f">FAMILY'S SITUATION</text>
  <text x="190" y="42" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">described in the family's own words</text>

  <!-- split -->
  <path d="M190 52 v12" fill="none" stroke="#8f9c99" stroke-width="2.6"/>
  <path d="M96 64 h188" fill="none" stroke="#8f9c99" stroke-width="2.6"/>
  <path d="M96 64 v10" fill="none" stroke="#8f9c99" stroke-width="2.6" marker-end="url(#na)"/>
  <path d="M284 64 v10" fill="none" stroke="#8f9c99" stroke-width="2.6" marker-end="url(#na)"/>

  <!-- model -->
  <rect x="8" y="78" width="176" height="108" rx="7" fill="#ffffff" stroke="#14453f" stroke-width="1.6"/>
  <text x="96" y="100" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="700" fill="#14453f">ELDERCARE-SPECIFIC</text>
  <text x="96" y="117" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="700" fill="#14453f">MODEL</text>
  <text x="96" y="139" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">language and reasoning</text>
  <text x="96" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">PEFT and RAG adaptation,</text>
  <text x="96" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">expert clinician review</text>

  <!-- rules -->
  <rect x="196" y="78" width="176" height="108" rx="7" fill="#e2edea" stroke="#c3d7d2"/>
  <text x="284" y="100" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="700" fill="#14453f">PROGRAM RULES</text>
  <text x="284" y="117" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="700" fill="#14453f">ENGINE</text>
  <text x="284" y="139" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">eligibility decisions</text>
  <text x="284" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">explicit and auditable,</text>
  <text x="284" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">not model judgment</text>

  <!-- merge -->
  <path d="M96 186 v12" fill="none" stroke="#8f9c99" stroke-width="2.6"/>
  <path d="M284 186 v12" fill="none" stroke="#8f9c99" stroke-width="2.6"/>
  <path d="M96 198 h188" fill="none" stroke="#8f9c99" stroke-width="2.6"/>
  <path d="M190 198 v14" fill="none" stroke="#8f9c99" stroke-width="2.6" marker-end="url(#na)"/>

  <!-- execution loop (built under this award) -->
  <rect x="8" y="216" width="364" height="58" rx="7" fill="#ffffff" stroke="#14453f" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="190" y="238" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#14453f">AGENT EXECUTION LOOP</text>
  <text x="190" y="255" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">prepares applications, tracks each filing,</text>
  <text x="190" y="269" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">escalates when a case stalls</text>

  <path d="M190 274 v14" fill="none" stroke="#8f9c99" stroke-width="2.6" marker-end="url(#na)"/>

  <!-- care established -->
  <rect x="110" y="292" width="160" height="32" rx="7" fill="#14453f"/>
  <text x="190" y="314" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#ffffff">CARE ESTABLISHED</text>

  <!-- legend -->
  <path d="M96 336 h22" fill="none" stroke="#14453f" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="126" y="340" font-family="Arial" font-size="12" fill="#43534f">built under this award</text>
</svg>
