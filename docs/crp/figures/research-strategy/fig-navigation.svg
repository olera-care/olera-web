<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 388" style="width:100%;display:block" role="img" aria-label="Navigation architecture. A family's situation, described in their own words, is read by an eldercare-specific model adapted under Phase IIB with parameter-efficient fine-tuning, retrieval-augmented generation, and expert clinician review, while a separate program rules engine in production decides eligibility explicitly rather than by model judgment. A case runtime built under this award prepares applications, assembles documents, books assessments, drafts communications, and holds state, deadlines, and escalation rules, until aid or care is established and the outcome record feeds Key Innovation 3.">
  <defs>
    <marker id="na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f9c99"/>
    </marker>
  </defs>

  <!-- family's situation -->
  <rect x="8" y="4" width="364" height="44" rx="7" fill="#f2f5f4" stroke="#d5dedc"/>
  <text x="190" y="24" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#14453f">FAMILY'S SITUATION</text>
  <text x="190" y="40" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">described in the family's own words</text>

  <!-- split -->
  <path d="M190 48 v12" fill="none" stroke="#8f9c99" stroke-width="2.6"/>
  <path d="M96 60 h188" fill="none" stroke="#8f9c99" stroke-width="2.6"/>
  <path d="M96 60 v10" fill="none" stroke="#8f9c99" stroke-width="2.6" marker-end="url(#na)"/>
  <path d="M284 60 v10" fill="none" stroke="#8f9c99" stroke-width="2.6" marker-end="url(#na)"/>

  <!-- model -->
  <rect x="8" y="78" width="176" height="100" rx="7" fill="#ffffff" stroke="#14453f" stroke-width="1.6"/>
  <text x="96" y="99" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="700" fill="#14453f">ELDERCARE-SPECIFIC</text>
  <text x="96" y="115" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="700" fill="#14453f">MODEL</text>
  <text x="96" y="134" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">language and reasoning</text>
  <text x="96" y="149" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">PEFT, RAG, expert review</text>
  <text x="96" y="169" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic" fill="#7a8886">built under Phase IIB</text>

  <!-- rules -->
  <rect x="196" y="78" width="176" height="100" rx="7" fill="#e2edea" stroke="#c3d7d2"/>
  <text x="284" y="99" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="700" fill="#14453f">PROGRAM RULES</text>
  <text x="284" y="115" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="700" fill="#14453f">ENGINE</text>
  <text x="284" y="134" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">eligibility decided</text>
  <text x="284" y="149" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">explicitly, not by model</text>
  <text x="284" y="169" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic" fill="#7a8886">in production</text>

  <!-- merge -->
  <path d="M96 178 v12" fill="none" stroke="#8f9c99" stroke-width="2.6"/>
  <path d="M284 178 v12" fill="none" stroke="#8f9c99" stroke-width="2.6"/>
  <path d="M96 190 h188" fill="none" stroke="#8f9c99" stroke-width="2.6"/>
  <path d="M190 190 v14" fill="none" stroke="#8f9c99" stroke-width="2.6" marker-end="url(#na)"/>

  <!-- case runtime -->
  <rect x="8" y="208" width="364" height="76" rx="7" fill="#ffffff" stroke="#14453f" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="190" y="230" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#14453f">CASE RUNTIME</text>
  <text x="190" y="247" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">prepares applications, assembles documents,</text>
  <text x="190" y="261" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">books assessments, drafts communications</text>
  <text x="190" y="275" text-anchor="middle" font-family="Arial" font-size="12" fill="#43534f">holds state, deadlines, and escalation rules</text>

  <path d="M190 284 v14" fill="none" stroke="#8f9c99" stroke-width="2.6" marker-end="url(#na)"/>

  <!-- established -->
  <rect x="80" y="302" width="220" height="32" rx="7" fill="#14453f"/>
  <text x="190" y="324" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#ffffff">AID OR CARE ESTABLISHED</text>

  <path d="M190 334 v12" fill="none" stroke="#8f9c99" stroke-width="2.2" marker-end="url(#na)"/>
  <text x="190" y="360" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#5b6b68">outcome record feeds Key Innovation 3</text>

  <!-- legend -->
  <path d="M104 380 h20" fill="none" stroke="#14453f" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="132" y="384" font-family="Arial" font-size="11" font-style="italic" fill="#7a8886">built under this award</text>
</svg>
