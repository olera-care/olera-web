<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 248" style="width:7.4in;margin:0 auto;display:block" role="img" aria-label="The two sides of the CareNavigator marketplace. A family works through the CareNavigator interface, which understands the need, identifies what fits, and helps the family act, connecting the family to a care provider who needs clients and staff.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f9c99"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="15" markerHeight="15"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f9c99"/>
    </marker>
    <clipPath id="famclip"><circle cx="72" cy="99" r="54"/></clipPath>
    <clipPath id="provclip"><circle cx="936" cy="99" r="54"/></clipPath>
  </defs>

  <!-- one platform between the two sides -->
  <rect x="240" y="8" width="506" height="182" rx="14" fill="#f7faf9"/>

  <!-- ============ FAMILY ============ -->
  <circle cx="100" cy="99" r="54" fill="#f2f5f4"/>
  <g transform="translate(28,0)">
    <g clip-path="url(#famclip)">
      <path d="M60 161 q0-43 28-43 q28 0 28 43 z" fill="#e79a90"/>
      <circle cx="88" cy="93" r="19" fill="#f0c3bb"/>
      <path d="M69 90 q3-20 19-20 q16 0 19 20 q-8-11-19-11 q-11 0-19 11z" fill="#3d5a63"/>
      <path d="M30 161 q0-38 25-38 q25 0 25 38 z" fill="#e8b4ac"/>
      <circle cx="55" cy="106" r="18" fill="#eebfb7"/>
      <path d="M39 99 q5-13 16-13 q11 0 16 13 q-7-7-16-7 q-9 0-16 7z" fill="#d3dad8"/>
      <path d="M49 116 q6 3 13 0" fill="none" stroke="#c8938a" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
  <text x="100" y="212" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">Family</text>
  <text x="100" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#5d6f6b">needs daily help at home</text>

  <path d="M168 74 q35-26 70-12" fill="none" stroke="#8f9c99" stroke-width="4.5" marker-end="url(#ah)"/>
  <path d="M238 140 q-35 16-70-9" fill="none" stroke="#8f9c99" stroke-width="4.5" marker-end="url(#ah)"/>

  <!-- ============ CARENAVIGATOR INTERFACE ============ -->
  <g transform="translate(51,0)">
    <rect x="200" y="16" width="98" height="166" rx="14" fill="#fff" stroke="#c7d0ce" stroke-width="2.5"/>
    <rect x="207" y="23" width="84" height="152" rx="9" fill="#fbfcfc"/>
    <circle cx="218" cy="34" r="4.5" fill="#2e7d5b"/>
    <text x="249" y="59" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="700" fill="#1d2b29">Hoping to stay at</text>
    <text x="249" y="72" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="700" fill="#1d2b29">home, or exploring</text>
    <text x="249" y="85" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="700" fill="#1d2b29">facilities?</text>
    <rect x="214" y="96" width="70" height="20" rx="10" fill="#f0f3f2" stroke="#dde3e2"/>
    <text x="249" y="110" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#41504d">Stay at home</text>
    <rect x="214" y="121" width="70" height="20" rx="10" fill="#f0f3f2" stroke="#dde3e2"/>
    <text x="249" y="135" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#41504d">Explore facilities</text>
    <rect x="214" y="146" width="70" height="20" rx="10" fill="#f0f3f2" stroke="#dde3e2"/>
    <text x="249" y="160" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#41504d">Not sure</text>
  </g>
  <text x="300" y="212" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">CareNavigator</text>
  <text x="300" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#5d6f6b">free to families</text>

  <path d="M360 99 h30" fill="none" stroke="#8f9c99" stroke-width="3.4" marker-start="url(#ah2)" marker-end="url(#ah2)"/>

  <!-- ============ WHAT IT DOES ============ -->
  <rect x="400" y="20" width="330" height="50" rx="8" fill="#14453f"/>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <rect x="418" y="33" width="20" height="25" rx="3"/>
    <path d="M423 41 h6 M423 48 h6"/>
    <path d="M432 39 l3 3 l6-7" stroke-width="2.4"/>
  </g>
  <text x="452" y="52" font-family="Arial" font-size="17" font-weight="700" fill="#ffffff">Understand the need</text>

  <rect x="400" y="78" width="330" height="50" rx="8" fill="#f2f5f4" stroke="#d5dedc"/>
  <g stroke="#14453f" stroke-width="2" fill="none">
    <rect x="418" y="91" width="17" height="21" rx="2.5"/>
    <path d="M422 98 h9 M422 104 h9"/>
    <path d="M439 94 v22 M439 116 h5"/>
  </g>
  <text x="452" y="110" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">Identify what fits</text>

  <rect x="400" y="136" width="330" height="50" rx="8" fill="#e2edea" stroke="#c3d7d2"/>
  <g stroke="#14453f" stroke-width="2" fill="none">
    <rect x="417" y="150" width="24" height="17" rx="3"/>
    <path d="M417 156 h24"/>
    <path d="M430 171 l4 4 l7-8" stroke-width="2.4"/>
  </g>
  <text x="452" y="168" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">Help the family act</text>

  <text x="565" y="212" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">AI-assisted navigation</text>

  <!-- ============ the two sides meet ============ -->
  <path d="M758 74 q35-26 70-12" fill="none" stroke="#8f9c99" stroke-width="4.5" marker-end="url(#ah)"/>
  <path d="M828 140 q-35 16-70-9" fill="none" stroke="#8f9c99" stroke-width="4.5" marker-end="url(#ah)"/>

  <!-- ============ CARE PROVIDER ============ -->
  <circle cx="890" cy="99" r="54" fill="#f2f5f4"/>
  <g transform="translate(-46,0)">
    <g clip-path="url(#provclip)">
      <path d="M904 161 q0-40 32-40 q32 0 32 40 z" fill="#5f9a90"/>
      <path d="M925 121 l11 12 l11-12 v10 l-11 10 l-11-10 z" fill="#eef4f2"/>
      <circle cx="936" cy="98" r="19" fill="#f0c9b6"/>
      <path d="M917 95 q3-20 19-20 q16 0 19 20 q-8-11-19-11 q-11 0-19 11z" fill="#43413f"/>
      <rect x="950" y="136" width="12" height="15" rx="2" fill="#eef4f2"/>
    </g>
  </g>
  <text x="890" y="212" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">Care Provider</text>
  <text x="890" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#5d6f6b">needs clients and staff</text>
</svg>
