<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 248" style="width:7.4in;margin:0 auto;display:block" role="img" aria-label="The two sides of the CareNavigator marketplace. A family works through the CareNavigator interface, which understands the need, identifies what fits, and helps the family act. Care providers, who need clients and staff, use the Provider Growth Suite to reach families, convert inquiries, and find staff.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f9c99"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="15" markerHeight="15"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f9c99"/>
    </marker>
  </defs>

  <!-- one platform between the two sides -->
  <rect x="168" y="8" width="676" height="182" rx="14" fill="#f7faf9"/>

  <!-- ============ FAMILY ============ -->
  <clipPath id="famclip"><circle cx="72" cy="99" r="54"/></clipPath>
  <circle cx="72" cy="99" r="54" fill="#f2f5f4"/>
  <g clip-path="url(#famclip)">
    <path d="M60 161 q0-43 28-43 q28 0 28 43 z" fill="#e79a90"/>
    <circle cx="88" cy="93" r="19" fill="#f0c3bb"/>
    <path d="M69 90 q3-20 19-20 q16 0 19 20 q-8-11-19-11 q-11 0-19 11z" fill="#3d5a63"/>
    <path d="M30 161 q0-38 25-38 q25 0 25 38 z" fill="#e8b4ac"/>
    <circle cx="55" cy="106" r="18" fill="#eebfb7"/>
    <path d="M39 99 q5-13 16-13 q11 0 16 13 q-7-7-16-7 q-9 0-16 7z" fill="#d3dad8"/>
    <path d="M49 116 q6 3 13 0" fill="none" stroke="#c8938a" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="72" y="212" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">Family</text>
  <text x="72" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#5d6f6b">needs daily help at home</text>

  <path d="M134 74 q28-24 56-10" fill="none" stroke="#8f9c99" stroke-width="4.5" marker-end="url(#ah)"/>
  <path d="M190 140 q-28 15-56-8" fill="none" stroke="#8f9c99" stroke-width="4.5" marker-end="url(#ah)"/>

  <!-- ============ CARENAVIGATOR INTERFACE ============ -->
  <rect x="200" y="16" width="98" height="166" rx="14" fill="#fff" stroke="#c7d0ce" stroke-width="2.5"/>
  <rect x="207" y="23" width="84" height="152" rx="9" fill="#fbfcfc"/>
  <circle cx="218" cy="34" r="4.5" fill="#2e7d5b"/>
  <text x="249" y="59" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="700" fill="#1d2b29">Hoping to stay at</text>
  <text x="249" y="72" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="700" fill="#1d2b29">home, or exploring</text>
  <text x="249" y="85" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="700" fill="#1d2b29">facilities?</text>
  <rect x="214" y="96" width="70" height="20" rx="10" fill="#f0f3f2" stroke="#dde3e2"/>
  <text x="249" y="110" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#41504d">Stay at home</text>
  <rect x="214" y="121" width="70" height="20" rx="10" fill="#f0f3f2" stroke="#dde3e2"/>
  <text x="249" y="135" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#41504d">Explore facilities</text>
  <rect x="214" y="146" width="70" height="20" rx="10" fill="#f0f3f2" stroke="#dde3e2"/>
  <text x="249" y="160" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#41504d">Not sure</text>
  <text x="249" y="212" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">CareNavigator</text>
  <text x="249" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#5d6f6b">free to families</text>

  <path d="M308 99 h32" fill="none" stroke="#8f9c99" stroke-width="3.4" marker-start="url(#ah2)" marker-end="url(#ah2)"/>

  <!-- ============ WHAT IT DOES FOR THE FAMILY ============ -->
  <rect x="350" y="20" width="222" height="50" rx="8" fill="#14453f"/>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <rect x="368" y="33" width="20" height="25" rx="3"/>
    <path d="M373 41 h6 M373 48 h6"/>
    <path d="M382 39 l3 3 l6-7" stroke-width="2.4"/>
  </g>
  <text x="402" y="51" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">Understand the need</text>

  <rect x="350" y="78" width="222" height="50" rx="8" fill="#f2f5f4" stroke="#d5dedc"/>
  <g stroke="#14453f" stroke-width="2" fill="none">
    <rect x="368" y="91" width="17" height="21" rx="2.5"/>
    <path d="M372 98 h9 M372 104 h9"/>
    <path d="M389 94 v22 M389 116 h5"/>
  </g>
  <text x="402" y="109" font-family="Arial" font-size="16" font-weight="700" fill="#14453f">Identify what fits</text>

  <rect x="350" y="136" width="222" height="50" rx="8" fill="#e2edea" stroke="#c3d7d2"/>
  <g stroke="#14453f" stroke-width="2" fill="none">
    <rect x="367" y="150" width="24" height="17" rx="3"/>
    <path d="M367 156 h24"/>
    <path d="M380 171 l4 4 l7-8" stroke-width="2.4"/>
  </g>
  <text x="402" y="167" font-family="Arial" font-size="16" font-weight="700" fill="#14453f">Help the family act</text>

  <text x="461" y="212" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">AI-assisted navigation</text>

  <!-- the two sides meet -->
  <path d="M584 99 h40" fill="none" stroke="#8f9c99" stroke-width="3.4" marker-start="url(#ah2)" marker-end="url(#ah2)"/>

  <!-- ============ WHAT IT DOES FOR THE PROVIDER ============ -->
  <rect x="636" y="20" width="196" height="50" rx="8" fill="#14453f"/>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M654 38 l16-7 v28 l-16-7 z"/>
    <path d="M654 38 h-4 v14 h4" />
    <path d="M676 40 q6 5 0 10"/>
  </g>
  <text x="690" y="51" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">Reach families</text>

  <rect x="636" y="78" width="196" height="50" rx="8" fill="#f2f5f4" stroke="#d5dedc"/>
  <g stroke="#14453f" stroke-width="2" fill="none">
    <path d="M652 91 h24 l-9 11 v10 l-6 3 v-13 z"/>
    <path d="M672 112 l4 4 l7-8" stroke-width="2.4"/>
  </g>
  <text x="690" y="109" font-family="Arial" font-size="16" font-weight="700" fill="#14453f">Convert inquiries</text>

  <rect x="636" y="136" width="196" height="50" rx="8" fill="#e2edea" stroke="#c3d7d2"/>
  <g stroke="#14453f" stroke-width="2" fill="none">
    <circle cx="656" cy="152" r="6"/>
    <path d="M646 172 q0-11 10-11 q10 0 10 11"/>
    <path d="M672 158 h11 M677.5 152.5 v11" stroke-width="2.4"/>
  </g>
  <text x="694" y="167" font-family="Arial" font-size="16" font-weight="700" fill="#14453f">Find staff</text>

  <text x="734" y="212" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">Provider Growth Suite</text>

  <path d="M842 74 q28-24 56-10" fill="none" stroke="#8f9c99" stroke-width="4.5" marker-end="url(#ah)"/>
  <path d="M898 140 q-28 15-56-8" fill="none" stroke="#8f9c99" stroke-width="4.5" marker-end="url(#ah)"/>

  <!-- ============ CARE PROVIDER ============ -->
  <clipPath id="provclip"><circle cx="936" cy="99" r="54"/></clipPath>
  <circle cx="936" cy="99" r="54" fill="#f2f5f4"/>
  <g clip-path="url(#provclip)">
    <path d="M904 161 q0-40 32-40 q32 0 32 40 z" fill="#5f9a90"/>
    <path d="M925 121 l11 12 l11-12 v10 l-11 10 l-11-10 z" fill="#eef4f2"/>
    <circle cx="936" cy="98" r="19" fill="#f0c9b6"/>
    <path d="M917 95 q3-20 19-20 q16 0 19 20 q-8-11-19-11 q-11 0-19 11z" fill="#43413f"/>
    <rect x="950" y="136" width="12" height="15" rx="2" fill="#eef4f2"/>
  </g>
  <text x="936" y="212" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#14453f">Care Provider</text>
  <text x="936" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#5d6f6b">needs clients and staff</text>
</svg>
