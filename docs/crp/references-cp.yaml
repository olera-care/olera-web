# CRP Commercialization Plan — live bibliography.
#
# Same schema and discipline as references.yaml, scoped to the Commercialization
# Plan. Kept separate because references.yaml is the source of truth for
# research-strategy.md and its numbering is generated from that document alone.
# Whether the two merge into one submitted bibliography attachment is an open
# decision; keeping them separate now does not foreclose either answer.
#
# `shared_key` marks a claim already carried by references.yaml. Do not create a
# second entry for a source the Research Strategy already cites: cite the same
# source in both documents so a reviewer reading both sees one provenance.
#
# `verified` records the date WE checked the source against the claim. Entries
# supplied by a team member and not yet independently re-checked carry
# `verified: pending` and a `provenance` line. They are not submission-ready.

blsAides2026:
  ref: "U.S. Bureau of Labor Statistics. Home Health and Personal Care Aides. Occupational Outlook Handbook. U.S. Department of Labor; updated 2026-08-27."
  url: https://www.bls.gov/ooh/healthcare/home-health-aides-and-personal-care-aides.htm
  supports: "Approximately 4.68 million home health and personal care aide jobs in 2025; approximately 760,500 openings projected each year, 2025 to 2035; 18 percent projected employment growth through 2035. BLS attributes many of the annual openings to workers transferring occupations or leaving the labor force, so the figure is a replacement-and-growth quantity rather than net new demand."
  verified: pending
  provenance: "Supplied by Logan 2026-08-28. Supersedes the earlier 4.35M/2024 and 766,000/2024-2034 figures used in the CP Section 4 draft."
  cp_ref_number: 26

