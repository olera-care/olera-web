# CRP Research Strategy — live bibliography.
#
# Source of truth for every citation in research-strategy.md. In-text markers use
# pandoc-citeproc syntax with these stable keys: [@key] or [@key1; @key2], placed
# immediately after the claim (and its punctuation) they support. Rendered
# numbering is generated from first appearance by tools/render_pdf.py — never
# hard-code reference numbers in prose. [@todo: description] marks a claim whose
# source is not yet verified; the renderer counts these and the document is not
# submission-ready while any remain.
#
# Every entry must record enough metadata to re-verify the claim (doi / pmid /
# url), a `supports` note stating exactly what was verified, and the date.
# Do not add an entry until the source has actually been checked against the
# claim it will support.

censusVintage2024:
  ref: "U.S. Census Bureau. Vintage 2024 Population Estimates: the 65-and-older population reached 61 million in 2024."
  url: https://www.census.gov/programs-surveys/popest.html
  supports: "Population 65+ reached 61 million in 2024."
  verified: 2026-08-19

