oleraProviderCount:
  ref: "Olera estimate: approximately 165,000 U.S. eldercare provider organizations, built from CDC NPALS regulated-provider counts plus approximately 100,000 state-licensed non-medical home care agencies (industry estimates; agencies are licensed by states rather than tracked federally). Consistent with Commercialization Plan Table 6."
  url: internal (docs/crp/market-denominator.md)
  supports: "The ~165,000 provider denominator; overlap treatment (memory care within senior living; CCRC levels embedded) documented in the workspace note."
  verified: 2026-08-19

oleraAcqSpendEst:
  ref: "Olera conservative bottom-up estimate: U.S. eldercare providers spend at least ~$5B/year on marketing and recruiting (senior living sales/marketing at 3% of ~$94B revenue; home care advertising at 1.1% of >$100B revenue; ~2M+ annual caregiver hires at $520 median acquisition cost). Assumptions and exclusions in docs/crp/market-denominator.md."
  url: internal (docs/crp/market-denominator.md)
  supports: "The estimated $5B+ annual marketing and recruiting spend; every input published, every choice at the conservative end, all omissions downward-biasing."
  verified: 2026-08-19

slSalesMarketingBench:
